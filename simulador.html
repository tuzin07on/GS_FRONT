<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador - ClimaPlantio</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <div class="container">

        <div class="logo">
            <h2>🌱 ClimaPlantio</h2>
        </div>

        <nav id="menu">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="simulador.html">Simulador</a></li>
                <li><a href="monitoramento.html">Monitoramento</a></li>

                <li><a href="integrantes.html">Equipe</a></li>
            </ul>
        </nav>

        <button id="menu-btn">☰</button>

    </div>
</header>

<main>

<section class="stats">

    <h1>Simulador de Plantio</h1>

    <div class="simulador-container">

        <label>Cultura:</label>

        <select id="cultura">

            <option value="">Selecione</option>

            <option>Milho</option>
            <option>Soja</option>
            <option>Feijão</option>

        </select>

        <label>CEP:</label>

        <input
            type="text"
            id="cep"
            placeholder="Digite o CEP">

        <button class="btn" onclick="simularPlantio()">
            Analisar Condições
        </button>

    </div>

    <div id="resultado" class="resultado">

    </div>

</section>

</main>

<footer>
    <p>© 2026 ClimaPlantio</p>
</footer>

<script src="js/script.js"></script>

</body>

</html>
